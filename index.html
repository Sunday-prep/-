<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خدمة الأحد - كنيسة مارمينا بشبرا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c2a44;--mut:#6b7488;--pri:#6e2b47;--gold:#c09a3e;--ok:#5b6b2e;--okbg:#e3ead5;--bad:#b3392f;--line:#e3dfd5;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2a;--card:#1b2740;--ink:#eef1f7;--mut:#9aa6bf;--pri:#d9b25f;--gold:#d9b25f;--ok:#6fd195;--okbg:#1d4a33;--bad:#ff8a80;--line:#2c3a58;--on:#121a2a}}
:root[data-theme="dark"]{--bg:#121a2a;--card:#1b2740;--ink:#eef1f7;--mut:#9aa6bf;--pri:#d9b25f;--gold:#d9b25f;--ok:#6fd195;--okbg:#1d4a33;--bad:#ff8a80;--line:#2c3a58;--on:#121a2a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.6;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--pri);color:var(--on)}
header .t{flex:1}header h1{margin:0;font-size:1.15rem;font-weight:800}header p{margin:0;font-size:.85rem;opacity:.85}
.logo{width:52px;height:52px;border-radius:12px;background:var(--card);display:grid;place-items:center;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.hb{background:transparent;border:1px solid currentColor;border-radius:8px;padding:4px 10px;color:var(--on);font-size:.85rem}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:1.3rem;margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:26px 14px;text-align:center;font-weight:800;font-size:1.15rem;min-height:110px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;width:100%}
.tile:hover{border-color:var(--gold)}
.tile small{font-weight:400;color:var(--mut);font-size:.85rem}
.tile .ac{position:absolute;top:6px;left:6px;display:flex;gap:2px}
.ic{background:none;border:0;padding:4px 7px;border-radius:8px;font-size:.95rem}.ic:hover{background:var(--bg)}
.tile.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tile.on::after{content:"✓ حاضر";font-size:.85rem;font-weight:600}
.add{border-style:dashed;color:var(--pri);background:transparent}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.back{background:none;border:0;color:var(--pri);font-weight:600;padding:0;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input,textarea{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.stat b{font-size:1.05rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:.9rem}
.hist{margin-top:8px;font-size:.85rem;color:var(--mut);border-top:1px dashed var(--line);padding-top:6px}
.login{max-width:360px;margin:8vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center}
.login .logo{width:150px;height:150px;border-radius:16px;margin:0 auto 12px;background:#fff}
.login label{display:block;text-align:right;font-size:.9rem;margin:12px 0 4px}
.err{color:var(--bad);min-height:1.4em;font-size:.9rem;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.show{display:flex}
.box{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.seg{display:flex;gap:8px;margin:10px 0}
.seg button{flex:1;padding:10px;border:2px solid var(--line);background:var(--card);border-radius:10px;font-weight:600}
.seg button.sel{border-color:var(--gold);background:var(--bg)}
.empty{color:var(--mut);text-align:center;padding:30px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem}.col h3{margin:0 0 6px;font-size:.9rem;line-height:1.4}.col ul{margin:0;padding:0 18px}.col .none{color:var(--mut)}.col small{color:var(--mut)}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){.tile,.btn{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<header id="hd" class="hide">
  <div class="logo" id="hlogo"></div>
  <div class="t"><h1>كنيسة مارمينا بشبرا</h1><p>خدمة الأحد</p></div>
  <button class="hb" id="out">خروج</button>
</header>

<div id="loginView" class="login hide">
  <div class="logo" id="llogo"></div>
  <h2 style="margin:0">كنيسة مارمينا بشبرا</h2>
  <p style="color:var(--mut);margin:2px 0 8px">خدمة الأحد</p>
  <label for="u">اسم المستخدم</label><input id="u" autocomplete="username" dir="ltr">
  <label for="p">كلمة المرور</label><input id="p" type="password" autocomplete="current-password" dir="ltr">
  <div class="err" id="err" role="alert"></div>
  <button class="btn" id="go" style="width:100%">دخول</button>
</div>

<main id="app" class="hide"></main>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>{const[y,m,dd]=d.split("-");return dd+"/"+m+"/"+y};

let S={families:[],att:{},vis:[]},cache={},loaded=false,unsub=null;
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v);
const pack=f=>({name:f.name,kids:f.kids,order:f.order||0,att:S.att[f.id]||{},vis:S.vis.filter(x=>x.fam===f.id).map(({fam,...r})=>r)});
const fail=()=>alert("تعذر الحفظ. تأكد من الإنترنت وحاول مرة أخرى.");
function save(){
  const ids=new Set(S.families.map(f=>f.id));
  S.families.forEach(f=>{const d=pack(f),j=sj(d);if(cache[f.id]!==j){cache[f.id]=j;setDoc(doc(db,"families",f.id),d).catch(fail)}});
  Object.keys(cache).forEach(id=>{if(!ids.has(id)){delete cache[id];deleteDoc(doc(db,"families",id)).catch(fail)}});
}
async function seed(){try{const m=doc(db,"meta","init");if((await getDoc(m)).exists())return;await setDoc(m,{done:true});["يوسف الصديق","الانبا موسى","مارمينا"].forEach((n,i)=>setDoc(doc(db,"families","f"+(i+1)),{name:n,kids:[],order:i+1,att:{},vis:[]}))}catch(e){}}
function listen(){
  if(unsub)return;
  unsub=onSnapshot(collection(db,"families"),snap=>{
    const fams=[],att={},vis=[],c={};
    snap.forEach(d=>{const x=d.data(),f={id:d.id,name:x.name,kids:x.kids||[],order:x.order||0};fams.push(f);att[d.id]=x.att||{};(x.vis||[]).forEach(r=>vis.push({...r,fam:d.id}));c[d.id]=sj({name:f.name,kids:f.kids,order:f.order,att:att[d.id],vis:x.vis||[]})});
    fams.sort((a,b)=>a.order-b.order);
    S={families:fams,att,vis};cache=c;
    if(snap.empty&&!snap.metadata.fromCache&&!loaded)seed();
    loaded=true;render();
  },()=>{$("#app").innerHTML='<div class="empty">تعذر تحميل البيانات. تأكد من الإنترنت ومن قواعد Firebase.</div>'});
}

const logoHTML=LOGO?`<img src="${LOGO}" alt="شعار الكنيسة">`:`<svg viewBox="0 0 40 40" width="30" height="30" aria-label="شعار"><path d="M17 5h6v10h10v6H23v14h-6V21H7v-6h10z" fill="#b8892d"/></svg>`;
$("#hlogo").innerHTML=logoHTML;$("#llogo").innerHTML=logoHTML;

let v={page:"home",fam:null,date:today()};
const fam=()=>S.families.find(f=>f.id===v.fam);

function pct(f,k){const d=S.att[f.id]||{};const ds=Object.keys(d);if(!ds.length)return null;return Math.round(ds.filter(x=>d[x][k.id]).length/ds.length*100)}

function alerts(f){
  const c=new Date();c.setDate(c.getDate()-30);const cut=c.getFullYear()+"-"+String(c.getMonth()+1).padStart(2,"0")+"-"+String(c.getDate()).padStart(2,"0");
  const low=f.kids.map(k=>({k,p:pct(f,k)})).filter(x=>x.p!==null&&x.p<50);
  const old=f.kids.map(k=>{const d=S.vis.filter(x=>x.kid===k.id).map(x=>x.date).sort().pop();return{k,d}}).filter(x=>!x.d||x.d<cut);
  const list=(a,fn)=>a.length?`<ul>${a.map(fn).join("")}</ul>`:`<div class="none">لا يوجد</div>`;
  return `<div class="cols"><div class="col"><h3>أولاد نسبة حضورهم أقل من 50%</h3>${list(low,x=>`<li>${esc(x.k.name)} <small>${x.p}%</small></li>`)}</div><div class="col"><h3>أولاد لم يتم افتقادهم منذ أكثر من شهر</h3>${list(old,x=>`<li>${esc(x.k.name)} <small>${x.d?fmt(x.d):"لم يُفتقد بعد"}</small></li>`)}</div></div>`;
}
function render(){
  const a=$("#app");
  if(!loaded){a.innerHTML='<div class="empty">جاري التحميل...</div>';return}
  if(v.page==="home"){
    a.innerHTML=`<h2>الأسر</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(310px,1fr))">${S.families.map(f=>`
      <div class="fam"><div class="tile" style="padding:0"><button class="tile" style="border:0;background:none;min-height:110px" data-open="${f.id}">${esc(f.name)}<small>${f.kids.length} طفل</small></button>
      <span class="ac"><button class="ic" data-ef="${f.id}" aria-label="تعديل ${esc(f.name)}">✏️</button><button class="ic" data-df="${f.id}" aria-label="حذف ${esc(f.name)}">🗑️</button></span></div>${alerts(f)}</div>`).join("")}
      <button class="tile add" id="addf">+ إضافة أسرة</button></div>`;
    return;
  }
  const f=fam(); if(!f){v.page="home";return render()}
  const back=(to,t)=>`<button class="back" data-go="${to}">← ${t}</button>`;
  if(v.page==="menu"){
    a.innerHTML=`${back("home","كل الأسر")}<h2>أسرة ${esc(f.name)}</h2><div class="grid">
      <button class="tile" data-go="status">📊 حالة الأسرة</button>
      <button class="tile" data-go="att">✅ حضور</button>
      <button class="tile" data-go="vis">📞 افتقاد</button></div>
      <div class="row" style="margin-top:22px"><button class="btn sec" data-go="kids">إدارة الأولاد (إضافة / تعديل / حذف)</button></div>`;
  }
  if(v.page==="kids"){
    a.innerHTML=`${back("menu","أسرة "+esc(f.name))}<h2>أولاد الأسرة</h2><div class="grid">${f.kids.map(k=>`
      <div class="tile">${esc(k.name)}<span class="ac"><button class="ic" data-ek="${k.id}" aria-label="تعديل">✏️</button><button class="ic" data-dk="${k.id}" aria-label="حذف">🗑️</button></span></div>`).join("")}
      <button class="tile add" id="addk">+ إضافة طفل</button></div>`;
  }
  if(v.page==="status"){
    a.innerHTML=`${back("menu","أسرة "+esc(f.name))}<h2>حالة الأسرة</h2>`+(f.kids.length?f.kids.map(k=>{
      const p=pct(f,k),vs=S.vis.filter(x=>x.kid===k.id),ph=vs.filter(x=>x.type==="تليفون").length,vi=vs.length-ph;
      return `<div class="stat"><b>${esc(k.name)}</b><div class="bar"><i style="width:${p||0}%"></i></div>
      <div class="meta"><span>نسبة الحضور: ${p===null?"لا يوجد تسجيل بعد":p+"%"}</span><span>افتقاد تليفون: ${ph}</span><span>افتقاد زيارة: ${vi}</span></div>
      ${vs.length?`<div class="hist">${vs.slice().sort((x,y)=>y.date.localeCompare(x.date)).slice(0,3).map(x=>`${fmt(x.date)} - ${x.type}${x.note?": "+esc(x.note):""}`).join("<br>")}</div>`:""}</div>`}).join(""):`<div class="empty">لا يوجد أولاد في الأسرة. أضفهم من «إدارة الأولاد».</div>`);
  }
  if(v.page==="att"){
    const rec=(S.att[f.id]||{})[v.date]||{};
    a.innerHTML=`${back("menu","أسرة "+esc(f.name))}<h2>تسجيل الحضور</h2>
      <div class="row"><label for="dt">اليوم:</label><input type="date" id="dt" value="${v.date}" style="max-width:200px"></div>`+
      (f.kids.length?`<div class="grid">${f.kids.map(k=>`<button class="tile ${rec[k.id]?"on":""}" data-pk="${k.id}" aria-pressed="${!!rec[k.id]}">${esc(k.name)}</button>`).join("")}</div>`:`<div class="empty">لا يوجد أولاد في الأسرة.</div>`);
  }
  if(v.page==="vis"){
    a.innerHTML=`${back("menu","أسرة "+esc(f.name))}<h2>الافتقاد</h2>`+(f.kids.length?`<div class="grid">${f.kids.map(k=>{const n=S.vis.filter(x=>x.kid===k.id).length;return `<button class="tile" data-vk="${k.id}">${esc(k.name)}<small>${n} افتقاد</small></button>`}).join("")}</div>`:`<div class="empty">لا يوجد أولاد في الأسرة.</div>`);
  }
}

function modal(html){$("#box").innerHTML=html;$("#modal").classList.add("show");const i=$("#box input,#box textarea");if(i)i.focus()}
const close=()=>$("#modal").classList.remove("show");
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal"||e.target.dataset.close!==undefined)close()});

function nameModal(title,val,cb){
  modal(`<h2 style="margin-top:0">${title}</h2><input id="nm" value="${esc(val)}" placeholder="الاسم">
  <div class="row" style="margin:16px 0 0"><button class="btn" id="ok">حفظ</button><button class="btn sec" data-close>إلغاء</button></div>`);
  const go=()=>{const x=$("#nm").value.trim();if(x){cb(x);save();close();render()}};
  $("#ok").onclick=go;$("#nm").onkeydown=e=>{if(e.key==="Enter")go()};
}
function confirmModal(msg,cb){
  modal(`<h2 style="margin-top:0">تأكيد الحذف</h2><p>${msg}</p><div class="row" style="margin:0"><button class="btn" style="background:var(--bad);color:#fff" id="ok">حذف</button><button class="btn sec" data-close>إلغاء</button></div>`);
  $("#ok").onclick=()=>{cb();save();close();render()};
}
function visModal(k){
  let type="تليفون";
  modal(`<h2 style="margin-top:0">افتقاد ${esc(k.name)}</h2>
  <div class="seg"><button class="sel" data-t="تليفون">📞 تليفون</button><button data-t="زيارة">🏠 زيارة</button></div>
  <label for="vd">التاريخ</label><input type="date" id="vd" value="${today()}">
  <label for="vn" style="display:block;margin-top:10px">ملاحظات</label><textarea id="vn" rows="4"></textarea>
  <div class="row" style="margin:16px 0 0"><button class="btn" id="ok">حفظ الافتقاد</button><button class="btn sec" data-close>إلغاء</button></div>`);
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{type=b.dataset.t;document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("sel",x===b))});
  $("#ok").onclick=()=>{S.vis.push({id:uid(),kid:k.id,fam:v.fam,type,note:$("#vn").value.trim(),date:$("#vd").value||today()});save();close();render()};
}

$("#app").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.open){v.fam=d.open;v.page="menu"}
  else if(d.go){v.page=d.go}
  else if(t.id==="addf"){return nameModal("إضافة أسرة","",n=>S.families.push({id:uid(),name:n,kids:[],order:Date.now()}))}
  else if(d.ef){const f=S.families.find(x=>x.id===d.ef);return nameModal("تعديل اسم الأسرة",f.name,n=>f.name=n)}
  else if(d.df){const f=S.families.find(x=>x.id===d.df);return confirmModal(`هل تريد حذف أسرة «${esc(f.name)}» وكل بياناتها؟`,()=>{S.families=S.families.filter(x=>x!==f);delete S.att[f.id];S.vis=S.vis.filter(x=>x.fam!==f.id)})}
  else if(t.id==="addk"){return nameModal("إضافة طفل","",n=>fam().kids.push({id:uid(),name:n}))}
  else if(d.ek){const k=fam().kids.find(x=>x.id===d.ek);return nameModal("تعديل اسم الطفل",k.name,n=>k.name=n)}
  else if(d.dk){const f=fam(),k=f.kids.find(x=>x.id===d.dk);return confirmModal(`هل تريد حذف «${esc(k.name)}» وكل بياناته؟`,()=>{f.kids=f.kids.filter(x=>x!==k);S.vis=S.vis.filter(x=>x.kid!==k.id);Object.values(S.att[f.id]||{}).forEach(r=>delete r[k.id])})}
  else if(d.pk){const A=S.att[v.fam]=S.att[v.fam]||{};const r=A[v.date]=A[v.date]||{};r[d.pk]?delete r[d.pk]:r[d.pk]=1;save()}
  else if(d.vk){return visModal(fam().kids.find(x=>x.id===d.vk))}
  else return;
  render();
});
$("#app").addEventListener("change",e=>{if(e.target.id==="dt"&&e.target.value){v.date=e.target.value;render()}});

function showApp(ok){
  $("#loginView").classList.toggle("hide",ok);$("#hd").classList.toggle("hide",!ok);$("#app").classList.toggle("hide",!ok);
  if(ok){v={page:"home",fam:null,date:today()};render()}
}
async function login(){
  const er=$("#err");er.textContent="";
  const bad="اسم المستخدم أو كلمة المرور غير صحيحة";
  if($("#u").value.trim().toLowerCase()!=="sunday"){er.textContent=bad;return}
  try{await signInWithEmailAndPassword(auth,EMAIL,$("#p").value)}
  catch(e){er.textContent=/invalid|wrong|user-not/.test(e.code||"")?bad:"تعذر الاتصال. تأكد من الإنترنت ومن إعدادات Firebase"}
}
$("#go").onclick=login;$("#p").onkeydown=e=>{if(e.key==="Enter")login()};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  if(u){listen()}else{if(unsub){unsub();unsub=null}loaded=false;S={families:[],att:{},vis:[]};cache={};$("#u").value=$("#p").value=""}
  showApp(!!u);
});
</script>
</body>
</html>
